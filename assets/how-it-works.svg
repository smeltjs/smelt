<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 214" width="840" height="214" role="img" aria-label="How smelt works: a blob goes in with a byte budget, a smaller blob comes out with a marker where each cut was, and the model retrieves the exact bytes back through smelt_retrieve, counted.">
  <title>How smelt works</title>
  <!--
    Three panels on the charcoal ground, left to right: the blob your agent was about to
    send, the smelted blob with one marker standing in for the cut, and the way back —
    smelt_retrieve, counted. Ember is the only accent; white-hot appears once, on the
    marker itself. No number in this picture is a measurement: the bars are a schematic
    of "lines", not a chart. Palette and rules: assets/PALETTE.md.
  -->
  <defs>
    <linearGradient id="hw-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1D22" />
      <stop offset="1" stop-color="#131417" />
    </linearGradient>
    <marker id="hw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E4602F" />
    </marker>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .h { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; }
      .s { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="840" height="214" rx="12" fill="url(#hw-ground)" />

  <!-- panel 1: the raw blob -->
  <text x="24" y="30" class="h" fill="#EFEBE5">what your agent was about to send</text>
  <rect x="24" y="44" width="200" height="138" rx="6" fill="#131417" stroke="#3F444C" />
  <g fill="#6E7783">
    <rect x="36" y="58" width="150" height="6" rx="2" />
    <rect x="36" y="70" width="120" height="6" rx="2" />
    <rect x="36" y="82" width="165" height="6" rx="2" />
    <rect x="36" y="94" width="90" height="6" rx="2" />
    <rect x="36" y="106" width="150" height="6" rx="2" />
    <rect x="36" y="118" width="130" height="6" rx="2" />
    <rect x="36" y="130" width="170" height="6" rx="2" />
    <rect x="36" y="142" width="100" height="6" rx="2" />
    <rect x="36" y="154" width="155" height="6" rx="2" />
    <rect x="36" y="166" width="120" height="6" rx="2" />
  </g>
  <!-- the two lines the focus matched -->
  <rect x="36" y="94" width="90" height="6" rx="2" fill="#EFEBE5" />
  <rect x="36" y="142" width="100" height="6" rx="2" fill="#EFEBE5" />
  <text x="124" y="200" text-anchor="middle" class="s" fill="#9AA1AC">a file, a grep, a log, a diff</text>

  <!-- arrow 1: smelt -->
  <line x1="236" y1="112" x2="316" y2="112" stroke="#E4602F" stroke-width="2" marker-end="url(#hw-arrow)" />
  <text x="276" y="100" text-anchor="middle" class="t" fill="#E4602F">smelt</text>
  <text x="276" y="130" text-anchor="middle" class="s" fill="#9AA1AC">--budget --focus</text>

  <!-- panel 2: the smelted blob -->
  <text x="332" y="30" class="h" fill="#EFEBE5">what the model receives</text>
  <rect x="332" y="44" width="200" height="138" rx="6" fill="#131417" stroke="#3F444C" />
  <g fill="#6E7783">
    <rect x="344" y="58" width="150" height="6" rx="2" />
    <rect x="344" y="70" width="120" height="6" rx="2" />
  </g>
  <rect x="344" y="82" width="90" height="6" rx="2" fill="#EFEBE5" />
  <!-- the marker: one line standing in for the cut -->
  <rect x="344" y="98" width="176" height="20" rx="4" fill="#2A2E34" stroke="#E4602F" />
  <text x="432" y="112" text-anchor="middle" class="t" fill="#FFF1D9" textLength="164" lengthAdjust="spacingAndGlyphs">&lt;&lt;smelt/v1: … retrieve("…")&gt;&gt;</text>
  <rect x="344" y="130" width="100" height="6" rx="2" fill="#EFEBE5" />
  <g fill="#6E7783">
    <rect x="344" y="142" width="155" height="6" rx="2" />
    <rect x="344" y="154" width="120" height="6" rx="2" />
  </g>
  <text x="432" y="200" text-anchor="middle" class="s" fill="#9AA1AC">a named rule, a size, a hash — never a model's opinion</text>

  <!-- arrow 2: the way back -->
  <line x1="544" y1="112" x2="636" y2="112" stroke="#E4602F" stroke-width="2" marker-end="url(#hw-arrow)" />
  <text x="590" y="100" text-anchor="middle" class="t" fill="#E4602F" textLength="84" lengthAdjust="spacingAndGlyphs">smelt_retrieve</text>
  <text x="590" y="130" text-anchor="middle" class="s" fill="#9AA1AC">counted</text>

  <!-- panel 3: the store -->
  <text x="652" y="30" class="h" fill="#EFEBE5">the exact bytes, back</text>
  <rect x="652" y="44" width="168" height="138" rx="6" fill="#131417" stroke="#3F444C" />
  <g fill="#6E7783">
    <rect x="664" y="58" width="128" height="6" rx="2" />
    <rect x="664" y="70" width="96" height="6" rx="2" />
    <rect x="664" y="82" width="120" height="6" rx="2" />
  </g>
  <line x1="664" y1="98" x2="808" y2="98" stroke="#2A2E34" />
  <text x="664" y="116" class="t" fill="#9AA1AC">stored locally</text>
  <text x="664" y="131" class="t" fill="#9AA1AC">keyed by hash</text>
  <text x="664" y="152" class="t" fill="#E4602F">expansion rate</text>
  <text x="664" y="168" class="s" fill="#9AA1AC">counted, never thresholded</text>
  <text x="736" y="200" text-anchor="middle" class="s" fill="#9AA1AC">nothing leaves the machine</text>
</svg>
